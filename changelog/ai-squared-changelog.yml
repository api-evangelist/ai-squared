entries:
- date: '2026-09'
  url: https://docs.squared.ai/release-notes/2026/September-2026.md
  classes:
  - chores
  breaking: false
  highlights:
  - Agentic Coding GitHub integration hardened - daily token rotation with rate-limit backoff,
    last-commit-hash recorded alongside code hash, structured commit intents, merge-conflict
    resolution with ours/theirs strategies.
  - Git and webhook endpoints rate limited against request floods.
  - New API endpoint returning the Git session-event history of an Agentic Coding session -
    chronological, metadata redacted, paginated to a maximum of 100 items, rate limited to 60
    requests per minute per IP.
  - Backwards compatibility for older Agentic Coding sandbox images - Git installed automatically
    when absent.
- date: '2026-08'
  url: https://docs.squared.ai/release-notes/2026/August-2026.md
  classes:
  - features
  - bug-fixes
  - chores
  breaking: false
  highlights:
  - Model Hub improvements; App Builder security scanner.
  - GitHub source-control integration provider on the server; conflict-handling API and conflict
    status.
  - AI model sample payloads made cheap and editable; request logs now include Origin and Referer.
- date: '2026-07'
  url: https://docs.squared.ai/release-notes/2026/July-2026.md
  classes:
  - enhancements
  - maintenance
  breaking: false
  highlights:
  - OAuth 2.0 client-credentials authentication for HTTP connectors.
  - Cookie-based authentication with CSRF protection; refinements to cookie auth and CSRF
    handling.
  - Configurable allowed origins for embedded Data Apps and Agentic Apps, with an Allowed Origins
    admin UI in Settings.
  - Expanded HTTP source response parsing; async deployment creation for agentic coding.
- date: '2026-06'
  url: https://docs.squared.ai/release-notes/2026/June-2026.md
  classes:
  - enhancements
