aid: ai-squared
name: AI Squared
description: AI Squared is an enterprise data-and-AI integration platform that connects data sources (Snowflake,
  BigQuery, Databricks, Redshift, PostgreSQL, S3, Salesforce and more) to AI/ML model endpoints (OpenAI,
  Anthropic, Google Vertex, AWS Bedrock, SageMaker, WatsonX) and then pushes the resulting insights back
  into the business applications where work happens. The company acquired Multiwoven, the open-source
  Reverse ETL / composable CDP project, in 2024 and now develops it as the open core of the platform under
  AGPL-3.0. Its public REST API at api.squared.ai covers connectors, connector definitions, models, catalogs,
  syncs, sync runs and sync records, authenticated with a JWT bearer token. AI Squared is SOC 2 Type II
  certified and ships SaaS, cloud, on-premise and air-gapped federal deployments.
