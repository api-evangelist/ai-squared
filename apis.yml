- aid: ai-squared:ai-squared-api
  name: AI Squared API
  description: 'REST API for the AI Squared platform covering connectors (data and
    AI/ML sources and destinations), connector definitions and connection checks,
    models, catalogs, syncs, scheduled/manual sync triggers, sync runs and sync
    records. JSON request and response bodies, JWT bearer authentication, page /
    page_size pagination capped at 100 items, and a documented 100 requests-per-minute
    rate limit returning 429.'
