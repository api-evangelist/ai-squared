authorship: platform
authorship_note: >-
  Generated by the Mintlify documentation platform from AI Squared's own docs, and served under
  AI Squared's host and /.well-known/ manifest. The tool names are namespaced to the provider
  (search_ai_squared, query_docs_filesystem_ai_squared) but the server shape is the vendor's, not
  a hand-built AI Squared server.
tools:
- name: search_ai_squared
  title: Search documentation
  summary: >-
    Search the AI Squared knowledge base for documentation, code examples, API reference entries
    and guides; returns contextual content with titles and direct doc links.
  input_schema:
    query: string (required)
  annotations:
    read_only: true
    destructive: false
    idempotent: true
    open_world: false
- name: query_docs_filesystem_ai_squared
  title: Query the documentation filesystem
  summary: >-
    Run read-only shell-like commands (ls, cat, head, rg, tree) against a sandboxed in-memory
    filesystem containing only the AI Squared documentation pages and API-reference specs.
  input_schema:
    command: string (required)
  annotations:
    read_only: true
    destructive: false
    idempotent: true
    open_world: false
- name: submit_feedback
  title: Submit documentation feedback
  summary: >-
    Report a problem with a documentation page (incorrect, outdated, confusing, incomplete, or a
    broken example) to the docs team. The only write in the server.
  input_schema:
    path: string (required)
    feedback: string (required)
  annotations:
    read_only: false
    destructive: false
    idempotent: false
    open_world: true
platform_mcp_consumption:
  note: >-
    Separately from publishing this server, the AI Squared PRODUCT is an MCP client: its Workflows
    feature ships an Agent component and an MCP Tools component that connect to external MCP
    servers, with 26 pre-integrated remote MCP server tools plus custom MCP server support.
    That is AI Squared consuming MCP, not serving it, and is recorded here so the two are not
    conflated.
  source: https://docs.squared.ai/workflows/mcp-tools
