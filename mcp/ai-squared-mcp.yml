  description: Search across the AI Squared knowledge base to find relevant information, code examples,
    API references, and guides. Use this tool when you need to answer questions about AI Squared, find
    specific documentation, understand how features work, or locate implementation details. The search
    returns contextual content with titles and direct links to the documentation pages. If you need the
    full content …
- name: query_docs_filesystem_ai_squared
  title: Query the documentation filesystem
  summary: Run read-only shell-like commands (ls, cat, head, rg, tree) against a sandboxed in-memory filesystem
    containing only the AI Squared documentation pages and API-reference specs.
  input_schema:
    command: string (required)
  annotations:
    read_only: true
    destructive: false
    idempotent: true
    open_world: false
  description: 'Run a read-only shell-like query against a virtualized, in-memory filesystem rooted at
    `/` that contains ONLY the AI Squared documentation pages and OpenAPI specs. This is NOT a shell on
    any real machine — nothing runs on the user''s computer, the server host, or any network. The filesystem
    is a sandbox backed by documentation chunks.  This is how you read documentation pages: there is no
    separate …'
- name: submit_feedback
  title: Submit documentation feedback
  summary: Report a problem with a documentation page (incorrect, outdated, confusing, incomplete, or
    a broken example) to the docs team. The only write in the server.
  input_schema:
    path: string (required)
    feedback: string (required)
  annotations:
    read_only: false
    destructive: false
    idempotent: false
    open_world: true
  description: Report a problem with this documentation site so the docs team can fix it. Use when a documentation
    page is incorrect, outdated, confusing, incomplete, or has a broken example. This is for feedback
    about the documentation content itself — not for product support requests or feedback about this tool
    or assistant.
platform_mcp_consumption:
  note: 'Separately from publishing this server, the AI Squared PRODUCT is an MCP client: its Workflows
    feature ships an Agent component and an MCP Tools component that connect to external MCP servers,
    with 26 pre-integrated remote MCP server tools plus custom MCP server support. That is AI Squared
    consuming MCP, not serving it, and is recorded here so the two are not conflated.'
  source: https://docs.squared.ai/workflows/mcp-tools
