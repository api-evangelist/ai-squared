name: AI Squared Documentation MCP Server
description: 'An anonymous, read-mostly MCP server over the AI Squared documentation corpus, advertised
  by AI Squared at /.well-known/mcp.json on its own documentation host. It exposes documentation search,
  a read-only virtual filesystem over the docs pages and API reference, and a docs-feedback write. It
  is a DOCUMENTATION server, not a control plane: no tool in it calls the AI Squared REST API at api.squared.ai,
  so an agent cannot create a connector, run a sync or read sync records through MCP.'
