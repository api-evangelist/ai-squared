source: https://docs.squared.ai/.well-known/mcp.json
name: AI Squared Documentation MCP Server
description: >-
  An anonymous, read-mostly MCP server over the AI Squared documentation corpus, advertised by
  AI Squared at /.well-known/mcp.json on its own documentation host. It exposes documentation
  search, a read-only virtual filesystem over the docs pages and API reference, and a
  docs-feedback write. It is a DOCUMENTATION server, not a control plane: no tool in it calls the
  AI Squared REST API at api.squared.ai, so an agent cannot create a connector, run a sync or read
  sync records through MCP.
status: live
deployment:
  mode: remote
  endpoint: https://docs.squared.ai/mcp
  auth: none
  verified: probed
discovery:
  well_known: https://docs.squared.ai/.well-known/mcp.json
  well_known_status: 200
  advertised_url: https://multiwoven-74.main-kill-isr.mintlify.me/mcp
  note: >-
    The /.well-known/mcp.json manifest names a Mintlify-hosted preview origin
    (multiwoven-74.main-kill-isr.mintlify.me). Both that URL and the provider-branded alias
    https://docs.squared.ai/mcp were POSTed with tools/list; both returned HTTP 200 with an
    identical tool set. The provider-branded endpoint is recorded as the deployment endpoint
    because it is the one on a host AI Squared controls.
