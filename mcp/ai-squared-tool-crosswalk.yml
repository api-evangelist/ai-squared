  The MCP server is a documentation server (search, read-only docs filesystem, docs feedback); the
  REST API is the platform control plane (connectors, models, catalogs, syncs, sync runs, sync
  records). Every MCP tool is mcp_only and every one of the 29 REST operations is rest_only. This
