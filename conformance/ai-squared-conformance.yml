- id: pagination
  conforms: true
  evidence: >-
    Two documented styles - page / page_size (max 100) in the API reference introduction, and
    page[number] / page[size] on the sync-run and sync-record operations in the contract.
    Collection responses carry links {self, first, prev, next, last}.
  note: The two styles are not reconciled in the docs. See conventions/ai-squared-conventions.yml
- id: idempotency
  conforms: false
  evidence: >-
    No Idempotency-Key header or equivalent anywhere in the contract or the documentation index.
    conventions idempotency.coverage = none.
- id: json-api
  conforms: false
  evidence: >-
    The response envelope resembles JSON:API - a top-level data member with a links object
    carrying self/first/prev/next/last, and page[number]/page[size] bracketed pagination - but the
    media type is application/json rather than application/vnd.api+json, resources are not typed
    resource objects with type/id/attributes, and no JSON:API conformance is claimed. Recorded as
    resemblance, not conformance.
- id: odata
