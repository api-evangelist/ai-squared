domain_standards:
- id: multiwoven-protocol
  name: Multiwoven Protocol
  first_party: true
  industry_standard: false
  conforms: true
  evidence: >-
    https://docs.squared.ai/open-source/guides/architecture/multiwoven-protocol and the reference
    implementation at
    https://github.com/Multiwoven/multiwoven-integrations/blob/main/lib/multiwoven/integrations/protocol/protocol.rb
  detail: >-
    AI Squared publishes and implements its own connector protocol - Source, Destination, Stream,
    Catalog, Model, Sync, ConnectorSpecification, all enveloped in a MultiwovenMessage - so that
    third parties can build connectors without knowledge of the core platform. It surfaces in the
    public REST API as the catalog.streams[] structure on POST/PUT /api/v1/catalogs
    (json_schema, batch_support, batch_size, request_method, request_rate_limit,
    request_rate_limit_unit, request_rate_concurrency) and as the source/destination/model/stream
    /sync_mode/cursor_field fields on the sync operations.
  note: >-
    This is a vendor protocol that AI Squared governs, not a multi-vendor standard. It is recorded
    as a domain protocol the provider publishes, and deliberately NOT as domain-standard
    conformance.
- id: airbyte-protocol
  name: Airbyte Protocol
  conforms: false
  evidence: >-
    The Multiwoven Protocol's vocabulary is Airbyte-Protocol-shaped - ConnectorSpecification,
    Catalog, Stream, supported_sync_modes, source_defined_cursor, default_cursor_field,
    source_defined_primary_key, namespace, destination_sync_mode. AI Squared nowhere claims
    Airbyte Protocol conformance, publishes no compatibility matrix, and the message envelope is
    its own (MultiwovenMessage). Recorded as lineage, not conformance - an integrator cannot
    assume an Airbyte connector drops in.
- id: singer-spec
  conforms: false
  evidence: No Singer tap/target compatibility claimed or documented.
- id: openlineage
  conforms: false
  evidence: No lineage-event emission documented, despite the platform's audit-trail claims.
market_note: >-
  Reward-only check. The reverse-ETL / data-activation / composable-CDP market has no ratified
  interchange standard - the field is governed by de facto vendor protocols (Airbyte's, Singer's,
  Multiwoven's). No standard was invented here to fill the slot.
