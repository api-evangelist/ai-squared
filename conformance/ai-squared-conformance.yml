method: derived
source: >-
  openapi/ai-squared-openapi.yml, https://docs.squared.ai/api-reference/introduction,
  https://docs.squared.ai/open-source/guides/architecture/multiwoven-protocol,
  https://docs.squared.ai/deployment-and-security/security-and-compliance/overview
summary: >-
  AI Squared makes one substantiated compliance claim (SOC 2 Type II) and publishes one first-party
  connector protocol (the Multiwoven Protocol). It declares conformance to no cross-cutting API
  standard - no OAuth 2.0 on its own API, no OpenID Connect, no RFC 9457, no RFC 8594, no
  RFC 9116, no OData or JSON:API media type. The reverse-ETL / data-activation market it sells
  into has no ratified interchange standard, so the absence of a domain standard here is a
  property of the market, not a deficiency of the provider.
conformance:
- id: openapi-3.0
  conforms: true
  evidence: >-
    openapi/ai-squared-openapi.yml - the 29 per-operation documents AI Squared publishes at
    docs.squared.ai/api-reference each declare openapi: 3.0.1 with paths, parameters, requestBody
    and responses.
- id: json-schema
  conforms: true
  evidence: >-
    OpenAPI 3.0 Schema Objects throughout the contract, plus the Multiwoven Protocol's Stream
    object, which carries a json_schema field describing each stream -
    https://docs.squared.ai/open-source/guides/architecture/multiwoven-protocol
- id: http-bearer-jwt
  conforms: true
  evidence: >-
    components.securitySchemes.bearerAuth = {type: http, scheme: bearer, bearerFormat: JWT}, applied
    per-operation. Documented at https://docs.squared.ai/api-reference/introduction
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in the contract and no OAuth flow documented for the AI Squared API
    itself. OAuth 2.0 client-credentials appears only as an option the platform can use when it
    CONSUMES a customer's HTTP connector (July 2026 release notes) - AI Squared as client, not as
    authorization server.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration returns 404 on aisquared.ai, docs.squared.ai and
    api.squared.ai (probed 2026-09-13). No openIdConnect securityScheme in the contract.
- id: rfc9457
  conforms: false
  evidence: >-
    No application/problem+json response anywhere in the contract; error responses are bare status
    codes with a description string. See errors/ai-squared-problem-types.yml
- id: rfc8594
  conforms: false
  evidence: No Sunset or Deprecation header documented; no deprecation policy published.
- id: rfc9116
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 404 on every host probed 2026-09-13, although a disclosure
