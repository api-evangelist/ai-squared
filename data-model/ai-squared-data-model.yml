  - GET /api/v1/syncs/{sync_id}/sync_runs/{sync_run_id}
  note: Read-only; sync runs are created by triggering a sync, never posted directly.
- name: SyncRecord
  description: >-
    One row moved (or attempted) inside a SyncRun - the record payload, its status, and any error.
  id_field: id
  id_type: integer
  fields:
  - id
  - sync_run_id
  - sync_id
  - status
  - record
  - error
  - created_at
  - updated_at
  operations:
