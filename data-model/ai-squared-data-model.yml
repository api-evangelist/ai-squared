core_flow: >-
  Connector (source) + Connector (destination) -> Catalog (destination schema) -> Model (what to
  extract) -> Sync (the movement rule) -> SyncRun (one execution) -> SyncRecord (one row). That
  chain is the whole product, and it is the order in which an integrator must create objects.
