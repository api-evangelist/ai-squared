  id_field: id
  id_type: integer
  fields:
  - id
  - name
  - description
  - query
  - query_type
  - primary_key
  - connector_id
  - created_at
  - updated_at
  operations:
  - POST /api/v1/models
  - GET /api/v1/models
  - GET /api/v1/models/{id}
  - PUT /api/v1/models/{id}
  - DELETE /api/v1/models/{id}
- name: Sync
  description: >-
    The rule set for moving data from a source connector to a destination connector via a model,
